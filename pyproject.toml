[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-agent"
version = "0.1.0"
description = "Controllable enterprise incident investigation agent MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "langgraph>=0.4",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "mcp>=2.0,<3",
  "opentelemetry-api>=1.28",
  "prometheus-client>=0.21",
]

[project.scripts]
devflow-eval = "devflow.eval_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
